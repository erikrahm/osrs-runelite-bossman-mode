plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.slf4j:slf4j-simple:1.7.12'
    testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion, {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
}

group = 'com.bossman'
version = '0.1.0'
sourceCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

task createProperties(dependsOn: processResources) {
    doLast {
        def bronzeFile = layout.buildDirectory.file("resources/main/bossmanmode_version.txt").get().asFile
        bronzeFile.text = "version=$project.version"
    }
}

classes {
    dependsOn createProperties
}
// Launches a RuneLite client with this plugin loaded (same as running BossmanModePluginTest from an IDE).
task runClient(type: JavaExec, dependsOn: testClasses) {
    group = 'application'
    description = 'Run RuneLite with Bossman Mode loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bossman.BossmanModePluginTest'
    args = ['--developer-mode']
    jvmArgs = ['-ea', '--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens', 'java.desktop/sun.awt=ALL-UNNAMED']
}
